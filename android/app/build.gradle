plugins {
  id 'com.android.application'
}

android {
  namespace 'com.parlour.billing.admin'
  compileSdk 35

  defaultConfig {
    applicationId 'com.parlour.billing.admin'
    minSdk 24
    // 34 keeps the classic status bar; 35 would force edge-to-edge drawing behind it.
    targetSdk 34
    versionCode 5
    versionName '1.4.0'
  }

  buildTypes {
    release {
      // Signed with the debug key so the APK installs straight onto a phone.
      // Swap in a real keystore before publishing anywhere.
      signingConfig signingConfigs.debug
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // WebViewAssetLoader gives the bundled web app a real https origin, so
  // IndexedDB (Dexie) and crypto work the same as in a browser.
  implementation 'androidx.webkit:webkit:1.12.1'
}
